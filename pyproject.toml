[project]
name = "rl-gpu-autotuner"
version = "0.1.0"
description = "RL-ready, budget-aware GPU kernel autotuning research project"
requires-python = ">=3.10"

[project.scripts]
rl-gpu-autotune = "rl_gpu_autotuner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
